# models
model_name_or_path: SAM-NER/models/Meta-Llama-3-8B-Instruct
trust_remote_code: true

# method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all

# dataset
dataset_dir: SAM-NER/data/PileNER/module2_EE
dataset: train
template: llama3
cutoff_len: 1024
max_samples: 400000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

# output
output_dir: SAM-NER/models/ED/Llama3-8B
logging_steps: 100
save_steps: 2000
plot_loss: true
overwrite_output_dir: true
save_only_model: false

# train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
flash_attn: auto
bf16: true
ddp_timeout: 180000000
